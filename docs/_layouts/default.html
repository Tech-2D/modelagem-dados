<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | escape }} · Tech-2D</title>
  <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}">
  <script src="{{ '/assets/docs.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <aside class="sidebar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">T2</span><span><strong>Tech-2D</strong><small>Documentação do banco</small></span></a>
    <nav aria-label="Documentação">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Visão geral</a>
      <a href="{{ '/postgresql.html' | relative_url }}"{% if page.url == '/postgresql.html' %} aria-current="page"{% endif %}>Catálogo PostgreSQL</a>
      <a href="{{ '/modelagem.html' | relative_url }}"{% if page.url == '/modelagem.html' %} aria-current="page"{% endif %}>Modelagem</a>
      <a href="{{ '/consultas.html' | relative_url }}"{% if page.url == '/consultas.html' %} aria-current="page"{% endif %}>Consultas SQL</a>
      <a href="{{ '/redis.html' | relative_url }}"{% if page.url == '/redis.html' %} aria-current="page"{% endif %}>Redis legado</a>
    </nav>
    <a class="repo-link" href="https://github.com/Tech-2D/modelagem-dados">Repositório no GitHub <span aria-hidden="true">↗</span></a>
  </aside>
  <div class="workspace">
    <main id="conteudo" class="article">
      <header class="page-heading">
        <h1>{{ page.title | escape }}</h1>
        {% if page.description %}<p>{{ page.description | escape }}</p>{% endif %}
      </header>
      {{ content }}
    </main>
    <nav class="on-this-page" aria-label="Nesta página" data-toc hidden><strong>Nesta página</strong><ul></ul></nav>
  </div>
</body>
</html>
